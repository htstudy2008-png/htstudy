<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Khóa học</title>
</head>
<body>

<h1 id="courseTitle"></h1>
<p id="courseDesc"></p>

<ul id="chapterList"></ul>

<script type="module">
  import { auth, db } from "./js/firebase.js";
  import {
  doc, getDoc, collection, getDocs
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
  import { onAuthStateChanged } from
    "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

  const params = new URLSearchParams(window.location.search);
  const courseId = params.get("id");

  if (!courseId) {
    alert("Thiếu ID khóa học");
    location.href = "dashboard.html";
  }

  onAuthStateChanged(auth, async (user) => {
    if (!user) {
      location.href = "login.html";
      return;
    }

    // 1) Kiểm tra quyền
    const userSnap = await getDoc(doc(db, "users", user.uid));
    const courses = userSnap.data()?.courses || [];
    if (!courses.includes(courseId)) {
      alert("Bạn không có quyền truy cập khóa học này");
      location.href = "dashboard.html";
      return;
    }

    // 2) Lấy thông tin khóa học
    const courseSnap = await getDoc(doc(db, "courses", courseId));
    const course = courseSnap.data();

    document.getElementById("courseTitle").innerText = course.title;
    document.getElementById("courseDesc").innerText = course.desc;

const chapterList = document.getElementById("chapterList");
chapterList.innerHTML = "";

// 3) Lấy danh sách chương
const chaptersRef = collection(db, "courses", courseId, "chapters");
const chaptersSnap = await getDocs(chaptersRef);

if (chaptersSnap.empty) {
  chapterList.innerHTML = "<li>Khóa học chưa có chương.</li>";
  return;
}

for (const chap of chaptersSnap.docs) {
  const chapData = chap.data();
  const li = document.createElement("li");
  li.innerHTML = `<strong>${chapData.title}</strong>`;

  // 4) Lấy bài trong chương
  const lessonsRef = collection(
    db, "courses", courseId, "chapters", chap.id, "lessons"
  );
  const lessonsSnap = await getDocs(lessonsRef);

  if (!lessonsSnap.empty) {
    const ul = document.createElement("ul");

    for (const les of lessonsSnap.docs) {
      const lesData = les.data();
      const lessonLi = document.createElement("li");
      lessonLi.innerHTML = `
        <a href="lesson.html?course=${courseId}&chapter=${chap.id}&lesson=${les.id}">
          ${lesData.title}
        </a>
      `;
      ul.appendChild(lessonLi);
    }

    li.appendChild(ul);
  } else {
    li.innerHTML += "<div>(Chưa có bài)</div>";
  }

  chapterList.appendChild(li);
}
  });
</script>

</body>
</html>
