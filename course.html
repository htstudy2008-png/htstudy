<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Khóa học | H&T STUDY</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: "Inter", Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #0f172a, #020617);
      color: #e5e7eb;
    }

    /* ===== HEADER ===== */
    .header {
      height: 64px;
      display: flex;
      align-items: center;
      padding: 0 24px;
      background: rgba(2,6,23,0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .back-btn {
      margin-right: 16px;
      padding: 8px 14px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.08);
      color: #e5e7eb;
      font-size: 14px;
      cursor: pointer;
      transition: 0.2s;
    }

    .back-btn:hover {
      background: rgba(255,255,255,0.18);
      transform: translateY(-1px);
    }

    .logo {
      font-weight: 700;
      font-size: 18px;
    }

    /* ===== MAIN ===== */
    .container {
      max-width: 900px;
      margin: auto;
      padding: 32px;
    }

    /* ===== COURSE INFO ===== */
    .course-header {
      margin-bottom: 32px;
    }

    .course-header h1 {
      font-size: 30px;
      margin-bottom: 8px;
      color: #93c5fd;
    }

    .course-header p {
      opacity: 0.85;
      max-width: 700px;
    }

    /* ===== CHAPTER ===== */
    .chapter {
      background: linear-gradient(
        135deg,
        rgba(255,255,255,0.12),
        rgba(255,255,255,0.04)
      );
      border: 1px solid rgba(255,255,255,0.15);
      backdrop-filter: blur(14px);
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.45);
    }

    .chapter-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 12px;
      color: #e0e7ff;
    }

    /* ===== LESSON LIST ===== */
    .lesson-list {
      list-style: none;
      padding-left: 0;
      margin: 0;
    }

    .lesson-list li {
      margin-bottom: 8px;
    }

    .lesson-list a {
      display: block;
      padding: 10px 14px;
      border-radius: 10px;
      text-decoration: none;
      color: #e5e7eb;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      transition: 0.2s;
    }

    .lesson-list a:hover {
      background: rgba(99,102,241,0.25);
      border-color: #6366f1;
      transform: translateX(4px);
    }

    .empty {
      opacity: 0.7;
      font-style: italic;
      padding-left: 4px;
    }
    .lesson-parent:hover {
  color: #93c5fd;
}

.lesson-parent {
  user-select: none;
}

  </style>
</head>

<body>

<header class="header">
  <button class="back-btn" onclick="history.back()">← Quay lại</button>
  <div class="logo">📘 H&T STUDY</div>
</header>

<main class="container">

  <div class="course-header">
    <h1 id="courseTitle"></h1>
    <p id="courseDesc"></p>
  </div>

  <div id="chapterList"></div>

</main>

<script type="module">
import { auth, db } from "./js/firebase.js";
import {
  doc, getDoc, collection, getDocs
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { onAuthStateChanged } from
  "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const params = new URLSearchParams(window.location.search);
const courseId = params.get("id");

if (!courseId) {
  alert("Thiếu ID khóa học");
  location.href = "dashboard.html";
}

onAuthStateChanged(auth, async (user) => {
  if (!user) {
    location.href = "login.html";
    return;
  }

  // 1) Kiểm tra quyền
  const userSnap = await getDoc(doc(db, "users", user.uid));
  const courses = userSnap.data()?.courses || [];
  if (!courses.includes(courseId)) {
    alert("Bạn không có quyền truy cập khóa học này");
    location.href = "dashboard.html";
    return;
  }

  // 2) Lấy thông tin khóa học
  const courseSnap = await getDoc(doc(db, "courses", courseId));
  const course = courseSnap.data();

  document.getElementById("courseTitle").innerText = course.title;
  document.getElementById("courseDesc").innerText = course.desc;

  const chapterBox = document.getElementById("chapterList");
  chapterBox.innerHTML = "";

  // 3) Lấy danh sách chương
  const chaptersRef = collection(db, "courses", courseId, "chapters");
  const chaptersSnap = await getDocs(chaptersRef);

  if (chaptersSnap.empty) {
    chapterBox.innerHTML = `<p class="empty">Khóa học chưa có chương.</p>`;
    return;
  }

  for (const chap of chaptersSnap.docs) {
    const chapData = chap.data();

    const chapterDiv = document.createElement("div");
    chapterDiv.className = "chapter";

    chapterDiv.innerHTML = `
      <div class="chapter-title">${chapData.title}</div>
    `;

    const lessonsRef = collection(
      db, "courses", courseId, "chapters", chap.id, "lessons"
    );
    const lessonsSnap = await getDocs(lessonsRef);

    if (!lessonsSnap.empty) {
      const ul = document.createElement("ul");
      ul.className = "lesson-list";

      for (const les of lessonsSnap.docs) {
  const lesData = les.data();

  // 👉 LESSON CHA (BÀI 1)
  const li = document.createElement("li");

  li.innerHTML = `
    <div class="lesson-parent" style="cursor:pointer; font-weight:600;">
      ▶ ${lesData.title}
    </div>
  `;

  // 👉 SUB LESSON LIST (ẨN BAN ĐẦU)
  const subUl = document.createElement("ul");
  subUl.style.marginLeft = "20px";
  subUl.style.marginTop = "6px";
  subUl.style.display = "none";

  // 👉 LOAD SUB LESSONS
  const subRef = collection(
    db,
    "courses", courseId,
    "chapters", chap.id,
    "lessons", les.id,
    "subLessons"
  );
  const subSnap = await getDocs(subRef);

  if (!subSnap.empty) {
    for (const sub of subSnap.docs) {
      const subData = sub.data();
      const subLi = document.createElement("li");

      subLi.innerHTML = `
        <a href="lesson.html
          ?course=${courseId}
          &chapter=${chap.id}
          &lesson=${les.id}
          &sub=${sub.id}">
          ▸ ${subData.title}
        </a>
      `;

      subUl.appendChild(subLi);
    }
  } else {
    subUl.innerHTML = `<li class="empty">(Chưa có bài)</li>`;
  }

  // 👉 TOGGLE CLICK
  li.querySelector(".lesson-parent").addEventListener("click", () => {
    const isOpen = subUl.style.display === "block";
    subUl.style.display = isOpen ? "none" : "block";
    li.querySelector(".lesson-parent").innerText =
      (isOpen ? "▶ " : "▼ ") + lesData.title;
  });

  li.appendChild(subUl);
  ul.appendChild(li);
}


      chapterDiv.appendChild(ul);
    } else {
      chapterDiv.innerHTML += `<div class="empty">(Chưa có bài)</div>`;
    }

    chapterBox.appendChild(chapterDiv);
  }
});
</script>

</body>
</html>
