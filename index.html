<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>H&T STUDY</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- HEADER -->
<header class="header">
  <div class="header-left">
    <button class="menu-btn" onclick="toggleSidebar()">☰</button>
    <span class="logo">H&T STUDY</span>
  </div>

  <div class="header-right">
  <a href="index.html" class="home-link">Trang chủ</a>

  <!-- NÚT ĐĂNG NHẬP (CHƯA LOGIN) -->
  <a href="login.html" id="loginBtn" class="login-btn">Đăng nhập</a>

  <!-- AVATAR (CHỈ HIỆN KHI ĐÃ LOGIN) -->
  <div class="avatar-box" id="avatarBox" style="display:none;" onclick="toggleAvatarMenu(event)">
    
    <!-- AVATAR CHỮ -->
    <div class="avatar-text" id="avatarText"></div>

    <div class="avatar-menu" id="avatarMenu">
      <a href="profile.html" id="profileLink" onclick="savePrevPage()">👤 Hồ sơ</a>
  <a href="dashboard.html" id="myCourses">📘 Khóa học của tôi</a>
      <a href="admin.html" id="adminLink" style="display:none;">
  🛠 Trang quản trị
</a>

  <hr>
  <a href="#" id="authAction">🔐 Đăng nhập</a>
</div>

  </div>
</div>

</header>

<div class="sidebar" id="sidebar">
  <nav>
    <a href="#">📘 Khóa học</a>
    <a href="#">📗 Toán 10</a>
    <a href="#">📕 Toán 11</a>
  </nav>
</div>

<div class="overlay" id="overlay" onclick="closeSidebar()"></div>

<main class="content">
  <div class="card">
    <h1>Khóa học của bạn</h1>
    <p>Chọn khóa học bên trái để bắt đầu.</p>
  </div>
</main>
<script>
function toggleSidebar() {
  document.querySelector(".sidebar").classList.toggle("active");
  document.querySelector(".menu-btn").classList.toggle("active");
}

  function closeSidebar() {
    document.getElementById("sidebar").classList.remove("active");
    document.getElementById("overlay").classList.remove("active");
  }

  function toggleAvatarMenu(e) {
    e.stopPropagation();
    document.getElementById("avatarMenu").classList.toggle("active");
  }

  document.addEventListener("click", () => {
    document.getElementById("avatarMenu").classList.remove("active");
  });
</script>
<script type="module">
import { auth } from "./js/firebase.js";
import { doc, getDoc } from
  "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { db } from "./js/firebase.js";

import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const profileLink = document.getElementById("profileLink");
const myCourses = document.getElementById("myCourses");
const adminLink = document.getElementById("adminLink");
const loginBtn = document.getElementById("loginBtn");
const avatarBox = document.getElementById("avatarBox");
const avatarText = document.getElementById("avatarText");
const authAction = document.getElementById("authAction");

let isLoggedIn = false;

/* THEO DÕI TRẠNG THÁI LOGIN */
onAuthStateChanged(auth, async (user) => {
  if (user) {
    // ✅ ĐÃ ĐĂNG NHẬP
    isLoggedIn = true;

    avatarBox.style.display = "flex";
    loginBtn.style.display = "none";

    avatarText.textContent = getInitials(user.displayName || user.email);
    authAction.textContent = "🚪 Đăng xuất";

    // 👉 HIỆN MENU SAU LOGIN
    profileLink.style.display = "block";
    myCourses.style.display = "block";
    // 🔐 KIỂM TRA ROLE ADMIN
const snap = await getDoc(doc(db, "users", user.uid));
if (snap.exists() && snap.data().role === "admin") {
  adminLink.style.display = "block";
} else {
  adminLink.style.display = "none";
}

  } else {
    // ❌ CHƯA ĐĂNG NHẬP
    isLoggedIn = false;

    avatarBox.style.display = "none";
    loginBtn.style.display = "inline-block";

    authAction.textContent = "🔐 Đăng nhập";

    // 👉 ẨN MENU CẦN LOGIN
    profileLink.style.display = "none";
    myCourses.style.display = "none";
    adminLink.style.display = "none";

  }

});


/* XỬ LÝ CLICK ĐĂNG NHẬP / ĐĂNG XUẤT */
authAction.addEventListener("click", async (e) => {
  e.preventDefault();

  if (isLoggedIn) {
    // ✅ ĐĂNG XUẤT
    await signOut(auth);
    // ❌ KHÔNG redirect
    // onAuthStateChanged sẽ tự cập nhật UI về trạng thái chưa đăng nhập
  } else {
    // ✅ ĐĂNG NHẬP
    localStorage.setItem("redirectAfterLogin", window.location.href);
    window.location.href = "login.html";
  }
});


function getInitials(name) {
  return name
    .trim()
    .split(" ")
    .map(word => word[0])
    .join("")
    .substring(0, 2)
    .toUpperCase();
}
</script>
<script>
function savePrevPage() {
  localStorage.setItem("prevPage", window.location.href);
}
</script>

</body>
</html>
