<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>H&T STUDY</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- HEADER -->
<header class="header">
  <div class="header-left">
    <button class="menu-btn" onclick="toggleSidebar()">☰</button>
    <span class="logo">H&T STUDY</span>
  </div>

  <div class="header-right">
  <a href="index.html" class="home-link">Trang chủ</a>

  <!-- NÚT ĐĂNG NHẬP (CHƯA LOGIN) -->
  <a href="login.html" id="loginBtn" class="login-btn">Đăng nhập</a>

  <!-- AVATAR (CHỈ HIỆN KHI ĐÃ LOGIN) -->
  <div class="avatar-box" id="avatarBox" style="display:none;" onclick="toggleAvatarMenu(event)">
    
    <!-- AVATAR CHỮ -->
    <div class="avatar-text" id="avatarText"></div>

    <div class="avatar-menu" id="avatarMenu">
      <a href="#">👤 Hồ sơ</a>
      <a href="#">📘 Khóa học của tôi</a>
      <hr>
      <a href="#" onclick="logout()">🚪 Đăng xuất</a>
    </div>
  </div>
</div>

</header>

<div class="sidebar" id="sidebar">
  <nav>
    <a href="#">📘 Khóa học</a>
    <a href="#">📗 Toán 10</a>
    <a href="#">📕 Toán 11</a>
  </nav>
</div>

<div class="overlay" id="overlay" onclick="closeSidebar()"></div>

<main class="content">
  <div class="card">
    <h1>Khóa học của bạn</h1>
    <p>Chọn khóa học bên trái để bắt đầu.</p>
  </div>
</main>
<script>
function toggleSidebar() {
  document.querySelector(".sidebar").classList.toggle("active");
  document.querySelector(".menu-btn").classList.toggle("active");
}

  function closeSidebar() {
    document.getElementById("sidebar").classList.remove("active");
    document.getElementById("overlay").classList.remove("active");
  }

  function toggleAvatarMenu(e) {
    e.stopPropagation();
    document.getElementById("avatarMenu").classList.toggle("active");
  }

  document.addEventListener("click", () => {
    document.getElementById("avatarMenu").classList.remove("active");
  });
</script>
<script type="module">
import { auth } from "./firebase.js";
import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const avatarBox = document.getElementById("avatarBox");
const loginBtn = document.getElementById("loginBtn");
const avatarText = document.getElementById("avatarText");

onAuthStateChanged(auth, (user) => {
  if (user) {
    // Đã đăng nhập
    avatarBox.style.display = "flex";
    loginBtn.style.display = "none";

    // Lấy chữ viết tắt tên
    const name = user.displayName || user.email;
    avatarText.textContent = getInitials(name);

  } else {
    // Chưa đăng nhập
    avatarBox.style.display = "none";
    loginBtn.style.display = "inline-block";
  }
});

function logout() {
  signOut(auth);
}

function getInitials(name) {
  return name
    .split(" ")
    .map(word => word[0])
    .join("")
    .substring(0, 2)
    .toUpperCase();
}
</script>
<script>
/* ===== AVATAR CHỮ VIẾT TẮT ===== */

// TẠM GIẢ LẬP TÊN (sau này thay bằng Firebase)
const fullName = "H T Study"; 

const avatarBox = document.getElementById("avatarBox");
const avatarText = document.getElementById("avatarText");
const loginBtn = document.getElementById("loginBtn");

// Hàm lấy chữ viết tắt
function getInitials(name) {
  return name
    .trim()
    .split(" ")
    .map(word => word[0])
    .join("")
    .substring(0, 2)
    .toUpperCase();
}

// GIẢ LẬP ĐÃ ĐĂNG NHẬP
const isLoggedIn = true;

if (isLoggedIn) {
  avatarBox.style.display = "flex";
  loginBtn.style.display = "none";
  avatarText.textContent = getInitials(fullName);
} else {
  avatarBox.style.display = "none";
  loginBtn.style.display = "inline-block";
}
</script>

</body>
</html>
