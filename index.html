<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>H&T STUDY</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- HEADER -->
<header class="header">
  <div class="header-left">
    <span class="logo">H&T STUDY</span>
  </div>

  <div class="header-center">
    <input type="search" placeholder="Tìm khóa học..." />
  </div>

  <div class="header-right">
    <div class="avatar-box" id="avatarBox" style="display:none;" onclick="toggleAvatarMenu(event)">
      <div class="avatar-text" id="avatarText"></div>

      <div class="avatar-menu" id="avatarMenu">
        <a href="profile.html">👤 Hồ sơ</a>
        <a href="dashboard.html">📘 Khóa học của tôi</a>
        <a href="admin.html" id="adminLink" style="display:none;">🛠 Trang quản trị</a>
        <hr>
        <a href="#" id="authAction">🚪 Đăng xuất</a>
      </div>
    </div>

    <a href="login.html" id="loginBtn" class="login-btn">Đăng nhập</a>
  </div>
</header>
<div class="app">
  <aside class="sidebar">
    <nav>
      <a class="active">📘 Tổng quan</a>
      <a>📗 Khóa học của tôi</a>
      <a>📕 Lộ trình</a>
      <a>📝 Bài tập</a>
      <a>📂 Tài liệu</a>
      <a>💬 Thảo luận</a>
    </nav>
  </aside>

  <main class="main">
    <section class="lesson">
      <h1>Khóa học của bạn</h1>
      <p>Chọn khóa học bên trái để bắt đầu.</p>
    </section>
  </main>
</div>


<main class="content">
  <div class="card">
    <h1>Khóa học của bạn</h1>
    <p>Chọn khóa học bên trái để bắt đầu.</p>
  </div>
</main>
<script>

  function toggleAvatarMenu(e) {
    e.stopPropagation();
    document.getElementById("avatarMenu").classList.toggle("active");
  }

  document.addEventListener("click", () => {
    document.getElementById("avatarMenu").classList.remove("active");
  });
</script>
<script type="module">
import { auth } from "./js/firebase.js";
import { doc, getDoc } from
  "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { db } from "./js/firebase.js";

import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const profileLink = document.getElementById("profileLink");
const myCourses = document.getElementById("myCourses");
const adminLink = document.getElementById("adminLink");
const loginBtn = document.getElementById("loginBtn");
const avatarBox = document.getElementById("avatarBox");
const avatarText = document.getElementById("avatarText");
const authAction = document.getElementById("authAction");

let isLoggedIn = false;

/* THEO DÕI TRẠNG THÁI LOGIN */
onAuthStateChanged(auth, async (user) => {
  if (user) {
    isLoggedIn = true;

    if (avatarBox) avatarBox.style.display = "flex";
    if (loginBtn) loginBtn.style.display = "none";

    if (avatarText)
      avatarText.textContent = getInitials(user.displayName || user.email);

    if (authAction) authAction.textContent = "🚪 Đăng xuất";
    if (profileLink) profileLink.style.display = "block";
    if (myCourses) myCourses.style.display = "block";

    const snap = await getDoc(doc(db, "users", user.uid));
    if (snap.exists() && snap.data().role === "admin") {
      if (adminLink) adminLink.style.display = "block";
    } else {
      if (adminLink) adminLink.style.display = "none";
    }

  } else {
    isLoggedIn = false;

    if (avatarBox) avatarBox.style.display = "none";
    if (loginBtn) loginBtn.style.display = "inline-block";

    if (authAction) authAction.textContent = "🔐 Đăng nhập";
    if (profileLink) profileLink.style.display = "none";
    if (myCourses) myCourses.style.display = "none";
    if (adminLink) adminLink.style.display = "none";
  }
});
);


/* XỬ LÝ CLICK ĐĂNG NHẬP / ĐĂNG XUẤT */
authAction.addEventListener("click", async (e) => {
  e.preventDefault();

  if (isLoggedIn) {
    // ✅ ĐĂNG XUẤT
    await signOut(auth);
    // ❌ KHÔNG redirect
    // onAuthStateChanged sẽ tự cập nhật UI về trạng thái chưa đăng nhập
  } else {
    // ✅ ĐĂNG NHẬP
    localStorage.setItem("redirectAfterLogin", window.location.href);
    window.location.href = "login.html";
  }
});


function getInitials(name) {
  return name
    .trim()
    .split(" ")
    .map(word => word[0])
    .join("")
    .substring(0, 2)
    .toUpperCase();
}
</script>
<script>
function savePrevPage() {
  localStorage.setItem("prevPage", window.location.href);
}
</script>

</body>
</html>
