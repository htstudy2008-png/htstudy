<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Admin Panel</title>
</head>
<body>

<h1>🛠 Admin Panel</h1>

<h2>➕ Tạo khóa học</h2>
<input id="courseId" placeholder="ID (vd: math11)" />
<input id="courseTitle" placeholder="Tên khóa học" />
<input id="courseDesc" placeholder="Mô tả" />
<button onclick="createCourse()">Tạo khóa học</button>

<hr>

<h2>➕ Tạo chương</h2>
<input id="cCourseId" placeholder="Course ID" />
<input id="chapterId" placeholder="Chapter ID (vd: c1)" />
<input id="chapterTitle" placeholder="Tên chương" />
<button onclick="createChapter()">Tạo chương</button>

<hr>

<h2>➕ Tạo bài học</h2>
<input id="lCourseId" placeholder="Course ID" />
<input id="lChapterId" placeholder="Chapter ID" />
<input id="lessonId" placeholder="Lesson ID (vd: l1)" />
<input id="lessonTitle" placeholder="Tên bài" />
<textarea id="lessonContent" placeholder="Nội dung bài"></textarea>
<button onclick="createLesson()">Tạo bài</button>
<script type="module">
  import { auth, db } from "./js/firebase.js";
  import { onAuthStateChanged } from
    "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
  import { doc, getDoc } from
    "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  onAuthStateChanged(auth, async (user) => {
    if (!user) {
      alert("Bạn chưa đăng nhập");
      window.location.href = "login.html";
      return;
    }

    try {
      const snap = await getDoc(doc(db, "users", user.uid));

      if (!snap.exists()) {
        alert("Không tìm thấy user trong Firestore");
        window.location.href = "dashboard.html";
        return;
      }

      const data = snap.data();

      if (data.role !== "admin") {
        alert("Bạn không phải admin");
        window.location.href = "dashboard.html";
        return;
      }

</body>
</html>
