<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Admin Panel</title>
</head>
<body>

<h1>🛠 Admin – Cấp quyền khóa học</h1>

<input id="userUid" placeholder="UID học sinh" />
<input id="courseId" placeholder="ID khóa (vd: math10)" />
<button onclick="grant()">Cấp quyền</button>

<br><br>

<button onclick="revoke()">Thu hồi quyền</button>
<script type="module">
import { auth, db } from "./js/firebase.js";
import { onAuthStateChanged } from
  "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import {
  doc,
  getDoc,
  updateDoc,
  arrayUnion,
  arrayRemove
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

onAuthStateChanged(auth, async (user) => {
  if (!user) location.href = "login.html";

  const snap = await getDoc(doc(db, "users", user.uid));
  if (snap.data()?.role !== "admin") {
    alert("Bạn không phải admin");
    location.href = "dashboard.html";
  }
});

// CẤP QUYỀN
window.grant = async () => {
  const uid = userUid.value.trim();
  const course = courseId.value.trim();

  if (!uid || !course) return alert("Thiếu dữ liệu");

  await updateDoc(doc(db, "users", uid), {
    courses: arrayUnion(course)
  });

  alert("Đã cấp quyền");
};

// THU HỒI
window.revoke = async () => {
  const uid = userUid.value.trim();
  const course = courseId.value.trim();

  if (!uid || !course) return alert("Thiếu dữ liệu");

  await updateDoc(doc(db, "users", uid), {
    courses: arrayRemove(course)
  });

  alert("Đã thu hồi quyền");
};
</script>

</body>
</html>
