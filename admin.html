<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Admin Panel</title>
</head>
<body>

<h1>🛠 Admin Panel</h1>

<h2>➕ Tạo khóa học</h2>
<input id="courseId" placeholder="ID (vd: math11)" />
<input id="courseTitle" placeholder="Tên khóa học" />
<input id="courseDesc" placeholder="Mô tả" />
<button onclick="createCourse()">Tạo khóa học</button>

<hr>

<h2>➕ Tạo chương</h2>
<input id="cCourseId" placeholder="Course ID" />
<input id="chapterId" placeholder="Chapter ID (vd: c1)" />
<input id="chapterTitle" placeholder="Tên chương" />
<button onclick="createChapter()">Tạo chương</button>

<hr>

<h2>➕ Tạo bài học</h2>
<input id="lCourseId" placeholder="Course ID" />
<input id="lChapterId" placeholder="Chapter ID" />
<input id="lessonId" placeholder="Lesson ID (vd: l1)" />
<input id="lessonTitle" placeholder="Tên bài" />
<textarea id="lessonContent" placeholder="Nội dung bài"></textarea>
<button onclick="createLesson()">Tạo bài</button>

<script type="module">
  import { auth, db } from "./js/firebase.js";
  import {
    doc, setDoc
  } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
  import { onAuthStateChanged } from
    "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

  let isAdmin = false;

  onAuthStateChanged(auth, async (user) => {
    if (!user) {
      location.href = "login.html";
      return;
    }

    const snap = await fetch(`https://firestore.googleapis.com/v1/projects/htstudy-3c8ae/databases/(default)/documents/users/${user.uid}`);
    const data = await snap.json();

    if (data.fields?.role?.stringValue !== "admin") {
      alert("Bạn không phải admin");
      location.href = "dashboard.html";
    }
  });

  window.createCourse = async () => {
    await setDoc(doc(db, "courses",
      courseId.value), {
      title: courseTitle.value,
      desc: courseDesc.value
    });
    alert("Đã tạo khóa học");
  };

  window.createChapter = async () => {
    await setDoc(doc(db, "courses",
      cCourseId.value,
      "chapters",
      chapterId.value), {
      title: chapterTitle.value
    });
    alert("Đã tạo chương");
  };

  window.createLesson = async () => {
    await setDoc(doc(db, "courses",
      lCourseId.value,
      "chapters",
      lChapterId.value,
      "lessons",
      lessonId.value), {
      title: lessonTitle.value,
      content: lessonContent.value
    });
    alert("Đã tạo bài");
  };
</script>

</body>
</html>
