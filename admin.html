<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Admin Panel</title>
</head>
<body>
<h1>🛠 Admin – Cấp quyền khóa học</h1>
<div id="studentList"></div>
<script type="module">
import { auth, db } from "./js/firebase.js";
import { onAuthStateChanged } from
  "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import {
  collection,
  getDocs,
  doc,
  updateDoc,
  arrayUnion,
  arrayRemove,
  getDoc
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

// Kiểm tra admin
onAuthStateChanged(auth, async (user) => {
  if (!user) return location.href = "login.html";

  const me = await getDoc(doc(db, "users", user.uid));
  if (me.data()?.role !== "admin") {
    alert("Bạn không phải admin");
    return location.href = "dashboard.html";
  }

  loadData();
});

async function loadData() {
  const studentsSnap = await getDocs(collection(db, "users"));
  const coursesSnap = await getDocs(collection(db, "courses"));

  const courses = coursesSnap.docs.map(d => d.id);
  const box = document.getElementById("studentList");
  box.innerHTML = "";

  for (const userDoc of studentsSnap.docs) {
    const u = userDoc.data();
    if (u.role === "admin") continue;

    const div = document.createElement("div");
    div.style.border = "1px solid #ccc";
    div.style.padding = "10px";
    div.style.marginBottom = "10px";

    div.innerHTML = `<strong>${u.email}</strong><br>`;

    for (const courseId of courses) {
      const checked = u.courses?.includes(courseId) ? "checked" : "";

      div.innerHTML += `
        <label>
          <input type="checkbox"
            ${checked}
            onchange="toggleCourse('${userDoc.id}', '${courseId}', this.checked)">
          ${courseId}
        </label><br>
      `;
    }

    box.appendChild(div);
  }
}

window.toggleCourse = async (uid, courseId, checked) => {
  const ref = doc(db, "users", uid);

  await updateDoc(ref, {
    courses: checked
      ? arrayUnion(courseId)
      : arrayRemove(courseId)
  });
};
</script>

</body>
</html>
