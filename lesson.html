<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Bài học | H&T STUDY</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: "Inter", Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #0f172a, #020617);
      color: #e5e7eb;
    }

    /* ===== HEADER ===== */
    .header {
      height: 64px;
      display: flex;
      align-items: center;
      padding: 0 24px;
      background: rgba(2,6,23,0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .back-btn {
      margin-right: 16px;
      padding: 8px 14px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.08);
      color: #e5e7eb;
      font-size: 14px;
      cursor: pointer;
      transition: 0.2s;
    }

    .back-btn:hover {
      background: rgba(255,255,255,0.18);
      transform: translateY(-1px);
    }

    .logo {
      font-weight: 700;
      font-size: 18px;
    }

    /* ===== MAIN ===== */
    .container {
      margin: auto;
      padding: 32px;
    }

    .lesson-header {
margin-bottom: 24px;
    }

    .lesson-header h1 {
      font-size: 28px;
      margin-bottom: 4px;
      color: #e5d08a;
    }

    .lesson-meta {
      font-size: 14px;
      opacity: 0.75;
    }

    /* ===== CONTENT ===== */
    .lesson-content {
      background: linear-gradient(
        135deg,
        rgba(255,255,255,0.12),
        rgba(255,255,255,0.04)
      );
      border: 1px solid rgba(255,255,255,0.15);
      backdrop-filter: blur(14px);
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.45);
      line-height: 1.75;
      font-size: 16px;
    }
.lesson-content p {
  margin-bottom: 14px;
}
.lesson-content h2,
.lesson-content h3 {
  color: #93c5fd;
  margin-top: 24px;
}
    .empty {
      opacity: 0.7;
      font-style: italic;
    }
    /* ===== LAYOUT ===== */
.layout {
  display: grid;
  grid-template-columns: 280px 1fr;
  gap: 32px;
  align-items: start;
}


/* ===== SIDEBAR ===== */
.lesson-sidebar {
  position: sticky;
  top: 88px; /* dưới header */
  max-height: calc(100vh - 120px);
  overflow-y: auto;
height: fit-content;
  background: linear-gradient(
    135deg,
    rgba(255,255,255,0.10),
    rgba(255,255,255,0.03)
  );
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 18px;
  padding: 16px 14px;
  box-shadow: 0 20px 40px rgba(0,0,0,0.35);
}

.lesson-sidebar h3 {
  margin-top: 0;
  margin-bottom: 12px;
  font-size: 16px;
  color: #e5d08a;
}

/* ===== TREE ===== */
.tree-item {
  margin-bottom: 6px;
}

.tree-title {
  display: flex;
  align-items: center;
  gap: 6px;

  cursor: pointer;
  font-weight: 600;
  padding: 8px 10px;
  border-radius: 8px;
  font-size: 14px;
  transition: 0.2s;
}

.tree-title:hover {
  background: rgba(255,255,255,0.08);
}

.tree-children {
  margin-left: 14px;
  padding-left: 6px;
  border-left: 1px dashed rgba(255,255,255,0.15);

  overflow: hidden;
  max-height: 0;
  opacity: 0;
  transition: max-height 0.35s ease, opacity 0.25s ease;
}

.tree-children.open {
  max-height: 1000px;
  opacity: 1;
}

/* ===== SUB LESSON ===== */
.sub-link {
  display: block;
  padding: 7px 10px;
  margin: 4px 0;

  border-radius: 8px;
  font-size: 14px;
  text-decoration: none;
  color: #e5e7eb;

  transition: 0.2s;
}

.sub-link:hover {
  background: rgba(99,102,241,0.25);
  transform: translateX(4px);
}

.sub-link.active {
  background: linear-gradient(
    135deg,
    rgba(99,102,241,0.45),
    rgba(99,102,241,0.25)
  );
  font-weight: 600;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,0.25);
}
@media (max-width: 900px) {
  .layout {
    grid-template-columns: 1fr;
  }

  .lesson-sidebar {
    position: relative;
    top: auto;
    max-height: none;
  }
}
.lesson-wrapper {
  max-width: 1200px;   /* toàn bộ khối */
  margin: 0 auto;
}
/* ===== VIDEO ===== */
.lesson-video {
  margin-bottom: 24px;
  border-radius: 18px;
  overflow: hidden;
  box-shadow: 0 20px 40px rgba(0,0,0,0.45);
}

.lesson-video iframe {
  width: 100%;
  height: 420px;
  border: none;
}

/* ===== PDF ===== */
.lesson-pdf {
  margin-bottom: 20px;
}

.lesson-pdf a {
  display: inline-block;
  padding: 10px 16px;
  border-radius: 10px;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.2);
  color: #93c5fd;
  text-decoration: none;
  font-weight: 500;
  transition: 0.2s;
}

.lesson-pdf a:hover {
  background: rgba(99,102,241,0.25);
}

  </style>
</head>

<body>

<header class="header">
  <button class="back-btn" id="backToCourse">← Quay lại</button>
  <div class="logo">📘 H&T STUDY</div>
</header>

<main class="container">
  <div class="lesson-wrapper layout">

  <!-- SIDEBAR -->
  <aside class="lesson-sidebar">
    <h3>Nội dung khóa học</h3>
    <div id="sidebarTree"></div>
  </aside>

  <!-- CONTENT -->
  <section class="lesson-main">
    <div class="lesson-header">
      <h1 id="lessonTitle">Đang tải...</h1>
      <div class="lesson-meta" id="lessonMeta"></div>
    </div>
    <!-- VIDEO -->
<div id="lessonVideo" class="lesson-video" style="display:none;">
  <iframe
    id="videoFrame"
    src=""
    allowfullscreen
    loading="lazy">
  </iframe>
</div>

<!-- PDF -->
<div id="lessonPdf" class="lesson-pdf" style="display:none;">
  <a id="pdfLink" target="_blank">📄 Tải tài liệu PDF</a>
</div>

    <div class="lesson-content" id="lessonContent">
      <p class="empty">Đang tải nội dung bài học...</p>
    </div>
    <div class="lesson-footer">
  <button id="nextLesson" class="back-btn">
    Bài tiếp theo →
  </button>
</div>

  </section>
  </div>
</main>


<script type="module">
import { auth, db } from "./js/firebase.js";
import {
  doc,
  getDoc,
  collection,
  getDocs
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import {
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const params = new URLSearchParams(window.location.search);

const courseId  = params.get("course");
const chapterId = params.get("chapter");
const lessonId  = params.get("lesson");
const subId     = params.get("sub"); // 👈 KHAI BÁO TRƯỚC
const lessonSequence = [];

const realSubId = subId === "null" || subId === undefined ? null : subId;
if (!courseId || !chapterId || !lessonId) {
  alert("Thiếu tham số bài học");
  location.href = "dashboard.html";
}

onAuthStateChanged(auth, async (user) => {
  if (!user) {
    location.href = "login.html";
    return;
  }
const backBtn = document.getElementById("backToCourse");

backBtn.addEventListener("click", () => {
  window.location.href = `course.html?id=${courseId}`;
});

  // 🔒 Kiểm tra quyền học
  const userSnap = await getDoc(doc(db, "users", user.uid));
  const courses = userSnap.data()?.courses || [];

  if (!courses.includes(courseId)) {
    alert("Bạn không có quyền truy cập khóa học này");
    location.href = "dashboard.html";
    return;
  }


const sidebar = document.getElementById("sidebarTree");

const chaptersSnap = await getDocs(
  collection(db, "courses", courseId, "chapters")
);

for (const chap of chaptersSnap.docs) {
  const chapData = chap.data();

  const chapDiv = document.createElement("div");
  chapDiv.innerHTML = `
    <div class="tree-title">▶ ${chapData.title}</div>
    <div class="tree-children"></div>
  `;

  const chapTitle = chapDiv.querySelector(".tree-title");
  const chapChildren = chapDiv.querySelector(".tree-children");

  chapTitle.onclick = () => {
  document
    .querySelectorAll(".tree-children.open")
    .forEach(el => {
      if (el !== chapChildren) el.classList.remove("open");
    });

  chapChildren.classList.toggle("open");
  chapTitle.innerText =
    (chapChildren.classList.contains("open") ? "▼ " : "▶ ") + chapData.title;
};

  const lessonsSnap = await getDocs(
    collection(db, "courses", courseId, "chapters", chap.id, "lessons")
  );

  for (const les of lessonsSnap.docs) {
    const lesData = les.data();

    const lesDiv = document.createElement("div");
    lesDiv.innerHTML = `
      <div class="tree-title">▶ ${lesData.title}</div>
      <div class="tree-children"></div>
    `;

    const lesTitle = lesDiv.querySelector(".tree-title");
    const lesChildren = lesDiv.querySelector(".tree-children");

    lesTitle.onclick = () => {
      lesChildren.classList.toggle("open");
      lesTitle.innerText =
        (lesChildren.classList.contains("open") ? "▼ " : "▶ ") + lesData.title;
    };

    const subSnap = await getDocs(
      collection(
        db,
        "courses", courseId,
        "chapters", chap.id,
        "lessons", les.id,
        "subLessons"
      )
    );
    // ===== BUILD NEXT LESSON ORDER =====
if (!subSnap.empty) {
  subSnap.forEach(sub => {
    lessonSequence.push({
      chapter: chap.id,
      lesson: les.id,
      sub: sub.id
    });
  });
} else {
  lessonSequence.push({
    chapter: chap.id,
    lesson: les.id,
    sub: null
  });
}


    subSnap.forEach(sub => {
      const a = document.createElement("a");
      a.className = "sub-link";
      a.href = `lesson.html?course=${courseId}&chapter=${chap.id}&lesson=${les.id}&sub=${sub.id}`;
      a.innerText = sub.data().title;

      if (
        chap.id === chapterId &&
        les.id === lessonId &&
        sub.id === subId
      ) {
        a.classList.add("active");
        chapChildren.classList.add("open");
        lesChildren.classList.add("open");
        chapTitle.innerText = "▼ " + chapData.title;
        lesTitle.innerText = "▼ " + lesData.title;
      }

      lesChildren.appendChild(a);
    });

    chapChildren.appendChild(lesDiv);
  }

  sidebar.appendChild(chapDiv);
  // ===== DEBUG NEXT LESSON (BƯỚC 3) =====
const realSubId = subId === "null" ? null : subId;

console.log("lessonSequence =", lessonSequence);
console.log("current =", {
  chapterId,
  lessonId,
  realSubId
});

}
// ===== BUILD FLAT LESSON LIST (CHO NEXT) =====

  let lessonRef;
const currentIndex = lessonSequence.findIndex(item =>
  item.chapter === chapterId &&
  item.lesson === lessonId &&
  item.sub === realSubId
);

const nextBtn = document.getElementById("nextLesson");

if (currentIndex !== -1 && currentIndex < lessonSequence.length - 1) {
  nextBtn.onclick = () => {
    const next = lessonSequence[currentIndex + 1];

    let url =
      `lesson.html?course=${courseId}` +
      `&chapter=${next.chapter}` +
      `&lesson=${next.lesson}`;

    if (next.sub !== null) {
      url += `&sub=${next.sub}`;
    }

    window.location.href = url;
  };
} else {
  nextBtn.innerText = "🎉 Hoàn thành khóa học";
  nextBtn.disabled = true;
}


  // 👉 BÀI CON (1.1)
  if (subId) {
    lessonRef = doc(
      db,
      "courses", courseId,
      "chapters", chapterId,
      "lessons", lessonId,
      "subLessons", subId
    );
  } 
  // 👉 BÀI CHA (Bài 1)
  else {
    lessonRef = doc(
      db,
      "courses", courseId,
      "chapters", chapterId,
      "lessons", lessonId
    );
  }

  const lessonSnap = await getDoc(lessonRef);

  if (!lessonSnap.exists()) {
    document.getElementById("lessonContent").innerHTML =
      `<p class="empty">Không tìm thấy nội dung bài học.</p>`;
    return;
  }

  const data = lessonSnap.data();

  document.getElementById("lessonTitle").innerText =
    data.title || "Bài học";

  document.getElementById("lessonMeta").innerText =
    subId ? "Bài học chi tiết" : "Bài học chính";

  document.getElementById("lessonContent").innerHTML =
    data.content || "<p class='empty'>(Chưa có nội dung)</p>";
    // ===== VIDEO =====
if (data.videoUrl) {
  const videoBox = document.getElementById("lessonVideo");
  const iframe = document.getElementById("videoFrame");

  iframe.src = data.videoUrl;
  videoBox.style.display = "block";
}

// ===== PDF =====
if (data.pdfUrl) {
  const pdfBox = document.getElementById("lessonPdf");
  const pdfLink = document.getElementById("pdfLink");

  pdfLink.href = data.pdfUrl;
  pdfBox.style.display = "block";
}
});

</script>

</body>
</html>
