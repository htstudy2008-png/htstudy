<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Bài học | H&T STUDY</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: "Inter", Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #0f172a, #020617);
      color: #e5e7eb;
    }

    /* ===== HEADER ===== */
    .header {
      height: 64px;
      display: flex;
      align-items: center;
      padding: 0 24px;
      background: rgba(2,6,23,0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .back-btn {
      margin-right: 16px;
      padding: 8px 14px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.08);
      color: #e5e7eb;
      font-size: 14px;
      cursor: pointer;
      transition: 0.2s;
    }

    .back-btn:hover {
      background: rgba(255,255,255,0.18);
      transform: translateY(-1px);
    }

    .logo {
      font-weight: 700;
      font-size: 18px;
    }

    /* ===== MAIN ===== */
    .container {
      max-width: 900px;
      margin: auto;
      padding: 32px;
    }

    .lesson-header {
      margin-bottom: 28px;
    }

    .lesson-header h1 {
      font-size: 28px;
      margin-bottom: 6px;
      color: #93c5fd;
    }

    .lesson-meta {
      font-size: 14px;
      opacity: 0.75;
    }

    /* ===== CONTENT ===== */
    .lesson-content {
      background: linear-gradient(
        135deg,
        rgba(255,255,255,0.12),
        rgba(255,255,255,0.04)
      );
      border: 1px solid rgba(255,255,255,0.15);
      backdrop-filter: blur(14px);
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.45);
      line-height: 1.7;
      font-size: 16px;
    }

    .lesson-content h2 {
      color: #e0e7ff;
      margin-top: 0;
    }

    .empty {
      opacity: 0.7;
      font-style: italic;
    }
    /* ===== LAYOUT ===== */
.layout {
  display: grid;
  grid-template-columns: 260px 1fr;
  gap: 24px;
}

/* ===== SIDEBAR ===== */
.lesson-sidebar {
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 16px;
  padding: 16px;
  height: fit-content;
}

.lesson-sidebar h3 {
  margin-top: 0;
  margin-bottom: 12px;
  font-size: 16px;
  color: #93c5fd;
}

/* ===== TREE ===== */
.tree-item {
  margin-bottom: 6px;
}

.tree-title {
  cursor: pointer;
  font-weight: 600;
  padding: 6px 8px;
  border-radius: 6px;
}

.tree-title:hover {
  background: rgba(255,255,255,0.08);
}

.tree-children {
  margin-left: 12px;
  overflow: hidden;
  max-height: 0;
  opacity: 0;
  transition: max-height 0.35s ease, opacity 0.25s ease;
}

.tree-children.open {
  max-height: 1000px;
  opacity: 1;
}

/* ===== SUB LESSON ===== */
.sub-link {
  display: block;
  padding: 6px 10px;
  border-radius: 6px;
  font-size: 14px;
  text-decoration: none;
  color: #e5e7eb;
}

.sub-link:hover {
  background: rgba(99,102,241,0.25);
}

.sub-link.active {
  background: rgba(99,102,241,0.45);
  font-weight: 600;
}

  </style>
</head>

<body>

<header class="header">
  <button class="back-btn" onclick="history.back()">← Quay lại</button>
  <div class="logo">📘 H&T STUDY</div>
</header>

<main class="container layout">
  <!-- SIDEBAR -->
  <aside class="lesson-sidebar">
    <h3>Nội dung khóa học</h3>
    <div id="sidebarTree"></div>
  </aside>

  <!-- CONTENT -->
  <section class="lesson-main">
    <div class="lesson-header">
      <h1 id="lessonTitle">Đang tải...</h1>
      <div class="lesson-meta" id="lessonMeta"></div>
    </div>

    <div class="lesson-content" id="lessonContent">
      <p class="empty">Đang tải nội dung bài học...</p>
    </div>
  </section>
</main>


<script type="module">
import { auth, db } from "./js/firebase.js";
import {
  doc, getDoc
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { onAuthStateChanged } from
  "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const params = new URLSearchParams(window.location.search);

const courseId  = params.get("course");
const chapterId = params.get("chapter");
const lessonId  = params.get("lesson");
const subId     = params.get("sub"); // nếu có → bài 1.1

if (!courseId || !chapterId || !lessonId) {
  alert("Thiếu tham số bài học");
  location.href = "dashboard.html";
}

onAuthStateChanged(auth, async (user) => {
  if (!user) {
    location.href = "login.html";
    return;
  }

  // 🔒 Kiểm tra quyền học
  const userSnap = await getDoc(doc(db, "users", user.uid));
  const courses = userSnap.data()?.courses || [];

  if (!courses.includes(courseId)) {
    alert("Bạn không có quyền truy cập khóa học này");
    location.href = "dashboard.html";
    return;
  }
import {
  collection, getDocs
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const sidebar = document.getElementById("sidebarTree");

const chaptersSnap = await getDocs(
  collection(db, "courses", courseId, "chapters")
);

for (const chap of chaptersSnap.docs) {
  const chapData = chap.data();

  const chapDiv = document.createElement("div");
  chapDiv.innerHTML = `
    <div class="tree-title">▶ ${chapData.title}</div>
    <div class="tree-children"></div>
  `;

  const chapTitle = chapDiv.querySelector(".tree-title");
  const chapChildren = chapDiv.querySelector(".tree-children");

  chapTitle.onclick = () => {
    chapChildren.classList.toggle("open");
    chapTitle.innerText =
      (chapChildren.classList.contains("open") ? "▼ " : "▶ ") + chapData.title;
  };

  const lessonsSnap = await getDocs(
    collection(db, "courses", courseId, "chapters", chap.id, "lessons")
  );

  for (const les of lessonsSnap.docs) {
    const lesData = les.data();

    const lesDiv = document.createElement("div");
    lesDiv.innerHTML = `
      <div class="tree-title">▶ ${lesData.title}</div>
      <div class="tree-children"></div>
    `;

    const lesTitle = lesDiv.querySelector(".tree-title");
    const lesChildren = lesDiv.querySelector(".tree-children");

    lesTitle.onclick = () => {
      lesChildren.classList.toggle("open");
      lesTitle.innerText =
        (lesChildren.classList.contains("open") ? "▼ " : "▶ ") + lesData.title;
    };

    const subSnap = await getDocs(
      collection(
        db,
        "courses", courseId,
        "chapters", chap.id,
        "lessons", les.id,
        "subLessons"
      )
    );

    subSnap.forEach(sub => {
      const a = document.createElement("a");
      a.className = "sub-link";
      a.href = `lesson.html?course=${courseId}&chapter=${chap.id}&lesson=${les.id}&sub=${sub.id}`;
      a.innerText = sub.data().title;

      if (
        chap.id === chapterId &&
        les.id === lessonId &&
        sub.id === subId
      ) {
        a.classList.add("active");
        chapChildren.classList.add("open");
        lesChildren.classList.add("open");
        chapTitle.innerText = "▼ " + chapData.title;
        lesTitle.innerText = "▼ " + lesData.title;
      }

      lesChildren.appendChild(a);
    });

    chapChildren.appendChild(lesDiv);
  }

  sidebar.appendChild(chapDiv);
}

  let lessonRef;

  // 👉 BÀI CON (1.1)
  if (subId) {
    lessonRef = doc(
      db,
      "courses", courseId,
      "chapters", chapterId,
      "lessons", lessonId,
      "subLessons", subId
    );
  } 
  // 👉 BÀI CHA (Bài 1)
  else {
    lessonRef = doc(
      db,
      "courses", courseId,
      "chapters", chapterId,
      "lessons", lessonId
    );
  }

  const lessonSnap = await getDoc(lessonRef);

  if (!lessonSnap.exists()) {
    document.getElementById("lessonContent").innerHTML =
      `<p class="empty">Không tìm thấy nội dung bài học.</p>`;
    return;
  }

  const data = lessonSnap.data();

  document.getElementById("lessonTitle").innerText =
    data.title || "Bài học";

  document.getElementById("lessonMeta").innerText =
    subId ? "Bài học chi tiết" : "Bài học chính";

  document.getElementById("lessonContent").innerHTML =
    data.content || "<p class='empty'>(Chưa có nội dung)</p>";
});
</script>

</body>
</html>
