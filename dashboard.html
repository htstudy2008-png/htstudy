<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Khóa học của tôi | H&T STUDY</title>
  <link rel="stylesheet" href="dashboard.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="header">
  <div class="header-left">
    <button class="menu-btn" onclick="toggleSidebar()">☰</button>
    <span class="logo">H&T STUDY</span>
  </div>

  <div class="header-right">
    <a href="index.html" class="home-link">Trang chủ</a>

    <a href="login.html" id="loginBtn" class="login-btn">Đăng nhập</a>

    <div class="avatar-box" id="avatarBox" style="display:none;" onclick="toggleAvatarMenu(event)">
      <div class="avatar-text" id="avatarText"></div>

      <div class="avatar-menu" id="avatarMenu">
        <a href="profile.html" onclick="savePrevPage()">👤 Hồ sơ</a>
        <a href="dashboard.html">📘 Khóa học của tôi</a>
        <hr>
        <a href="#" id="authAction">🚪 Đăng xuất</a>
      </div>
    </div>
  </div>
</header>
  <div class="sidebar" id="sidebar">
  <nav>
    <a href="dashboard.html" class="active">📘 Khóa học của tôi</a>
    <a href="#">📗 Toán 10</a>
    <a href="#">📕 Toán 11</a>
  </nav>
</div>

<div class="overlay" id="overlay" onclick="closeSidebar()"></div>

  <main class="content">
  <div class="card">
<h1>📘 Khóa học của bạn</h1>
<ul id="courseList"></ul>
</div>
</main>
<script>
function toggleSidebar() {
  document.getElementById("sidebar").classList.toggle("active");
  document.getElementById("overlay").classList.toggle("active");
}

function closeSidebar() {
  document.getElementById("sidebar").classList.remove("active");
  document.getElementById("overlay").classList.remove("active");
}

function toggleAvatarMenu(e) {
  e.stopPropagation();
  document.getElementById("avatarMenu").classList.toggle("active");
}

document.addEventListener("click", () => {
  document.getElementById("avatarMenu").classList.remove("active");
});
</script>
<script type="module">
import { auth, db } from "./js/firebase.js";
import { onAuthStateChanged, signOut } from
  "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { doc, getDoc } from
  "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const loginBtn = document.getElementById("loginBtn");
const avatarBox = document.getElementById("avatarBox");
const avatarText = document.getElementById("avatarText");
const authAction = document.getElementById("authAction");
const courseList = document.getElementById("courseList");

let isLoggedIn = false;

onAuthStateChanged(auth, async (user) => {
  if (!user) {
    localStorage.setItem("redirectAfterLogin", window.location.href);
    location.href = "login.html";
    return;
  }

  isLoggedIn = true;
  loginBtn.style.display = "none";
  avatarBox.style.display = "flex";
  avatarText.textContent = getInitials(user.displayName || user.email);

  // LOAD COURSES
  courseList.innerHTML = "";
  const snap = await getDoc(doc(db, "users", user.uid));
  const courses = snap.data()?.courses || [];

  if (courses.length === 0) {
    courseList.innerHTML = "<li>Bạn chưa được cấp khóa học nào.</li>";
    return;
  }

  for (const id of courses) {
    const cSnap = await getDoc(doc(db, "courses", id));
    if (!cSnap.exists()) continue;

    const c = cSnap.data();
    const li = document.createElement("li");
    li.innerHTML = `
      <strong>${c.title}</strong>
      <p>${c.desc}</p>
      <a href="course.html?id=${id}">Vào học</a>
    `;
    courseList.appendChild(li);
  }
});

authAction.addEventListener("click", async (e) => {
  e.preventDefault();
  if (isLoggedIn) {
    await signOut(auth);
  }
});

function getInitials(name) {
  return name.split(" ").map(w => w[0]).join("").substring(0,2).toUpperCase();
}
</script>

</body>
</html>
