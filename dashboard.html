<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Dashboard</title>
</head>
<body>

<h1>📘 Khóa học của bạn</h1>
<ul id="courseList"></ul>

<button onclick="logout()">Đăng xuất</button>

<script type="module">
  import { auth } from "./js/firebase.js";
  import { logout } from "./js/auth.js";
  import {
    getFirestore,
    doc,
    getDoc
  } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
  import { onAuthStateChanged } from
    "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

  const db = getFirestore();

  onAuthStateChanged(auth, async (user) => {
    if (!user) {
      location.href = "login.html";
      return;
    }

    try {
      // 1️⃣ Lấy user
      const userRef = doc(db, "users", user.uid);
      const userSnap = await getDoc(userRef);

      if (!userSnap.exists()) {
        alert("Không tìm thấy dữ liệu người dùng");
        return;
      }

      const userData = userSnap.data();
      const courses = userData.courses || [];

      const list = document.getElementById("courseList");
      list.innerHTML = "";

      // 2️⃣ Nếu chưa được cấp khóa
      if (courses.length === 0) {
        list.innerHTML = "<li>Bạn chưa được cấp khóa học nào.</li>";
        return;
      }

      // 3️⃣ Hiển thị từng khóa
      for (const courseId of courses) {
        const courseRef = doc(db, "courses", courseId);
        const courseSnap = await getDoc(courseRef);

        if (!courseSnap.exists()) {
          console.warn(`Khóa học ${courseId} không tồn tại`);
          continue;
        }

        const course = courseSnap.data();

        const li = document.createElement("li");
        li.innerHTML = `
          <strong>${course.title}</strong><br>
          <small>${course.desc}</small><br>
          <a href="course.html?id=${courseId}">Vào học</a>
        `;
        list.appendChild(li);
      }
    } catch (err) {
      console.error("Lỗi dashboard:", err);
      alert("Có lỗi khi tải khóa học, mở Console để xem chi tiết");
    }
  });
</script>

</body>
</html>
