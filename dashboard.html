<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Dashboard</title>
  <style>
/* ===== RESET ===== */
* {
  box-sizing: border-box;
  font-family: "Inter", Arial, sans-serif;
}

body {
  margin: 0;
  min-height: 100vh;
  padding: 40px;
  background: linear-gradient(135deg, #0f172a, #020617);
  color: #e5e7eb;
}

/* ===== TITLE ===== */
h1 {
  font-size: 28px;
  margin-bottom: 28px;
  display: flex;
  align-items: center;
  gap: 12px;
}

/* ===== COURSE LIST ===== */
#courseList {
  list-style: none;
  padding: 0;
  max-width: 560px;
}

/* ===== COURSE CARD ===== */
#courseList li {
  background: linear-gradient(
    135deg,
    rgba(255,255,255,0.12),
    rgba(255,255,255,0.04)
  );
  border: 1px solid rgba(255,255,255,0.15);
  backdrop-filter: blur(12px);
  border-radius: 18px;
  padding: 20px 22px;
  margin-bottom: 18px;
  box-shadow: 0 20px 40px rgba(0,0,0,0.45);
}

/* ===== COURSE TITLE ===== */
#courseList li strong {
  display: block;
  font-size: 18px;
  color: #93c5fd;
  margin-bottom: 6px;
}

/* ===== COURSE DESC ===== */
#courseList li small {
  display: block;
  color: #cbd5f5;
  opacity: 0.9;
  margin-bottom: 14px;
}

/* ===== ENTER COURSE BUTTON ===== */
#courseList li a {
  display: inline-block;
  padding: 10px 18px;
  border-radius: 10px;
  text-decoration: none;
  background: linear-gradient(135deg, #6366f1, #7c3aed);
  color: #ffffff;
  font-weight: 500;
  transition: all 0.25s ease;
}

#courseList li a:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 25px rgba(124,58,237,0.55);
}

/* ===== EMPTY STATE ===== */
#courseList li:only-child {
  text-align: center;
  font-style: italic;
  opacity: 0.85;
}

/* ===== LOGOUT BUTTON ===== */
#logoutBtn {
  margin-top: 32px;
  padding: 10px 18px;
  border-radius: 12px;
  border: none;
  background: rgba(255,255,255,0.08);
  color: #e5e7eb;
  cursor: pointer;
  font-size: 14px;
  transi

</head>
<body>

<h1>📘 Khóa học của bạn</h1>
<ul id="courseList"></ul>

<button id="logoutBtn">Đăng xuất</button>

<script type="module">
  import { auth, db } from "./js/firebase.js";
  import { logout } from "./js/auth.js";
  import { doc, getDoc } from
    "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
  import { onAuthStateChanged } from
    "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

  onAuthStateChanged(auth, async (user) => {
    if (!user) {
      location.href = "login.html";
      return;
    }

    const list = document.getElementById("courseList");
    list.innerHTML = "";

    const userSnap = await getDoc(doc(db, "users", user.uid));
    const courses = userSnap.data()?.courses || [];

    if (courses.length === 0) {
      list.innerHTML = "<li>Bạn chưa được cấp khóa học nào.</li>";
      return;
    }

    for (const courseId of courses) {
      const courseSnap = await getDoc(doc(db, "courses", courseId));
      if (!courseSnap.exists()) continue;

      const c = courseSnap.data();
      const li = document.createElement("li");
      li.innerHTML = `
        <strong>${c.title}</strong><br>
        <small>${c.desc}</small><br>
        <a href="course.html?id=${courseId}">Vào học</a>
      `;
      list.appendChild(li);
    }
  });

  // ✅ Gắn logout đúng chuẩn ES module
  document.getElementById("logoutBtn").addEventListener("click", () => {
    logout();
  });
</script>

</body>
</html>
