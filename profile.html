<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Hồ sơ học sinh</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
  <div class="header-left">
    <a href="index.html" class="logo">H&T STUDY</a>
  </div>
</header>

<main class="content">
  <div class="card profile-card">
    <h2>👤 Hồ sơ học sinh</h2>

    <div class="profile-row">
      <span>Họ và tên:</span>
      <strong id="fullName">—</strong>
    </div>

    <div class="profile-row">
      <span>Email:</span>
      <strong id="email">—</strong>
    </div>

    <div class="profile-row">
      <span>ID học sinh:</span>
      <strong id="uid">—</strong>
    </div>

    <div class="profile-row">
      <span>Trạng thái:</span>
      <strong class="status">Đã đăng nhập</strong>
    </div>

    <br>
    <a href="index.html">⬅ Quay lại trang chủ</a>
  </div>
</main>

<script type="module" src="js/profile.js"></script>
</body>
</html>
